apiVersion: apps/v1
kind: Deployment
metadata:
  name: vineeta-backend
  namespace: grupp1
  labels:
    app: vineeta-backend
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vineeta-backend
  template:
    metadata:
      labels:
        app: vineeta-backend
        tier: backend
    spec:
      containers:
        - name: vineeta-backend
          image: ghcr.io/vineeta05/backend-service:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_HOST
              value: "vineeta-postgresql"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRESQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRESQL_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRESQL_DATABASE
            - name: REDIS_HOST
              value: "vineeta-redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            - name: PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 200m
      imagePullSecrets:
        - name: ghcr-secret
